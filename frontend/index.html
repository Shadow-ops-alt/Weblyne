      • script-src needs 'unsafe-inline' because Google Tag Manager injects inline scripts.
        In production, replace with a nonce-based or hash-based CSP when GTM supports it.
      • style-src 'unsafe-inline' is required by React inline styles and GTM.
      • font-src fonts.gstatic.com — Google Fonts.
      • connect-src covers the Vercel API proxy and GTM data collection.
    -->

  <meta http-equiv="X-Frame-Options" content="DENY" />
